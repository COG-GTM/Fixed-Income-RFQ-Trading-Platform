spring.jpa.open-in-view=false
server.port=8080
use.confirmation.service=false
confirmationms.url=http://localhost:8070/

# API users (HTTP Basic). Passwords come from the environment; a blank password
# disables that user. Raw values are bcrypt-encoded at startup, or pass an
# already-encoded value such as {bcrypt}$2a$10$...
rfq.security.users[0].username=${RFQ_OPERATOR_USERNAME:operator}
rfq.security.users[0].password=${RFQ_OPERATOR_PASSWORD:}
rfq.security.users[0].role=OPERATOR
rfq.security.users[1].username=${RFQ_ACME_TRADER_USERNAME:acme-trader}
rfq.security.users[1].password=${RFQ_ACME_TRADER_PASSWORD:}
rfq.security.users[1].role=TRADER
rfq.security.users[1].counterparty-lei=549300EXAMPLE12345678

# Allowed execution price band, as a percentage of notional (par)
rfq.execution.min-price-pct=50
rfq.execution.max-price-pct=150
