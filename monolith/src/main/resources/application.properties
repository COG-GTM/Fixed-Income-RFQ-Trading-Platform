spring.jpa.open-in-view=false
server.port=8080
use.confirmation.service=false
confirmationms.url=http://localhost:8070/
# Execution price (total settlement amount) must fall within this ratio of the notional.
rfq.pricing.min-price-ratio=0.50
rfq.pricing.max-price-ratio=1.50
# API users are provisioned via environment variables, never committed. No users => every request gets 401.
# Example (passwords in Spring Security delegating format, bcrypt recommended):
#   RFQ_SECURITY_USERS_0_USERNAME=ops      RFQ_SECURITY_USERS_0_PASSWORD={bcrypt}...  RFQ_SECURITY_USERS_0_ROLE=OPERATOR
#   RFQ_SECURITY_USERS_1_USERNAME=acme     RFQ_SECURITY_USERS_1_PASSWORD={bcrypt}...  RFQ_SECURITY_USERS_1_ROLE=COUNTERPARTY  RFQ_SECURITY_USERS_1_COUNTERPARTYID=1
