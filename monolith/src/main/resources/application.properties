spring.jpa.open-in-view=false
server.port=8080
use.confirmation.service=false
confirmationms.url=http://localhost:8070/

# Real-time streaming toggles (see README "Real-time streaming")
# Master enable/disable for the simulated market-data feed
streaming.marketdata.enabled=true
# Interval (ms) of the simulated price feed
streaming.marketdata.interval-ms=2000
# Enable/disable the WebSocket/STOMP transport
streaming.websocket.enabled=true
# Enable/disable the SSE fallback endpoint
streaming.sse.enabled=true
