spring.application.name=${APP_NAME:fixed-income-rfq}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:rfqdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

use.confirmation.service=${USE_CONFIRMATION_SERVICE:false}
confirmationms.url=${CONFIRMATION_SERVICE_URL:http://localhost:8070/}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info}
management.endpoint.health.probes.enabled=true

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.javieraviles.splitthemonolith=${LOG_LEVEL_APP:INFO}
