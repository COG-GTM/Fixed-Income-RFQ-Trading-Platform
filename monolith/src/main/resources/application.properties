spring.jpa.open-in-view=false
server.port=8080

# Per-domain logical schemas (Phase 0 database seams).
# H2 does not auto-create schemas from JPA @Table(schema=...), so create them
# up front via the connection INIT clause before Hibernate generates the tables.
spring.datasource.url=jdbc:h2:mem:rfqdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS counterparty\\;CREATE SCHEMA IF NOT EXISTS bond\\;CREATE SCHEMA IF NOT EXISTS rfq
use.confirmation.service=false
confirmationms.url=http://localhost:8070/
