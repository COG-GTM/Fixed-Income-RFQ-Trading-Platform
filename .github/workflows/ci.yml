name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Tests and coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monolith
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run tests with JaCoCo coverage gate
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
            END {
              printf "### Coverage\n\n| Metric | Covered | Total | %% |\n|---|---|---|---|\n";
              printf "| Line | %d | %d | %.1f%% |\n", lc, lc+lm, 100*lc/(lc+lm);
              printf "| Branch | %d | %d | %.1f%% |\n", bc, bc+bm, 100*bc/(bc+bm);
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: monolith/target/site/jacoco/
          if-no-files-found: ignore
