name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Tests and coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monolith
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run tests with JaCoCo coverage gate
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
              printf "| Counter | Covered |\n|---|---|\n| Line | %.1f%% (%d/%d) |\n| Branch | %.1f%% (%d/%d) |\n",
                100*lc/(lm+lc), lc, lm+lc, 100*bc/(bm+bc), bc, bm+bc }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            monolith/target/surefire-reports/
            monolith/target/site/jacoco/
          if-no-files-found: ignore
